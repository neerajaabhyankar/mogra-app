<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mukta:wght@300;400;500;600;700&family=Tiro+Devanagari+Marathi:ital@0;1&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #0A0709; color: #FBEDE9; font-family: 'Mukta', ui-sans-serif, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #F7758F; } a:hover { color: #DD2F4F; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #0A0709; display: flex; flex-direction: column; padding: 54px 24px 34px; overflow: hidden;">

  <div style="display: flex; flex-direction: column; gap: 38px;">

    <div style="display: flex; flex-direction: column; gap: 22px;">
      <img src="logo.png" alt="mogra" style="width: 68px; height: 68px;">
      <div style="display: flex; flex-direction: column; gap: 9px;">
        <div style="font-family: 'Tiro Devanagari Marathi', Georgia, serif; font-size: 47px; line-height: 0.92; letter-spacing: -0.018em; color: #FBEDE9;">mogra</div>
        <div style="font-size: 13px; letter-spacing: 0.045em; color: rgba(251,237,233,0.50); line-height: 1.45;">Tools for Hindustani Classical Music</div>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 16px;">
      <div style="height: 1px; background: rgba(251,237,233,0.10);"></div>
      <div style="font-size: 10px; letter-spacing: 0.20em; text-transform: uppercase; font-weight: 700; color: rgba(251,237,233,0.32);">Tools</div>

      <div style="display: flex; flex-direction: column; gap: 10px;">

        <div style="display: flex; align-items: center; gap: 16px; padding: 20px 18px; border-radius: 4px; background: rgba(221,47,79,0.085); border: 1px solid rgba(221,47,79,0.32);">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" style="flex-shrink: 0; color: #DD2F4F;">
            <path d="M3 10.5v3"/><path d="M7.5 6.5v11"/><path d="M12 3.2v17.6"/><path d="M16.5 7.5v9"/><path d="M21 11v2"/>
          </svg>
          <div style="display: flex; flex-direction: column; gap: 4px; flex-grow: 1;">
            <div style="font-size: 17px; font-weight: 600; color: #FBEDE9;">Raag Identifier</div>
            <div style="font-size: 13px; line-height: 1.45; color: rgba(251,237,233,0.52); text-wrap: pretty;">Hum, sing or play. Get the five most likely raags.</div>
          </div>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; color: #DD2F4F;">
            <path d="M9 5l7 7-7 7"/>
          </svg>
        </div>

        <div style="display: flex; align-items: center; gap: 16px; padding: 20px 18px; border-radius: 4px; background: transparent; border: 1px solid rgba(251,237,233,0.10);">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; color: rgba(251,237,233,0.30);">
            <path d="M3 16.5l4.5-5.5 4.5 3.2 4.5-7.2L21 9.5"/>
            <circle cx="7.5" cy="11" r="1.5" fill="currentColor" stroke="none"/>
            <circle cx="12" cy="14.2" r="1.5" fill="currentColor" stroke="none"/>
            <circle cx="16.5" cy="7" r="1.5" fill="currentColor" stroke="none"/>
          </svg>
          <div style="display: flex; flex-direction: column; gap: 4px; flex-grow: 1;">
            <div style="font-size: 17px; font-weight: 600; color: rgba(251,237,233,0.50);">Raagfinder by Notes</div>
            <div style="font-size: 13px; line-height: 1.45; color: rgba(251,237,233,0.40); text-wrap: pretty;">Pick the swars you heard. See which raags fit.</div>
          </div>
          <div style="flex-shrink: 0; font-size: 9px; letter-spacing: 0.20em; font-weight: 700; color: rgba(251,237,233,0.34); border: 1px solid rgba(251,237,233,0.14); border-radius: 3px; padding: 5px 7px;">SOON</div>
        </div>

        <div style="display: flex; align-items: center; gap: 16px; padding: 20px 18px; border-radius: 4px; background: transparent; border: 1px solid rgba(251,237,233,0.10);">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; color: rgba(251,237,233,0.30);">
            <circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.3 15.3L21 21"/>
          </svg>
          <div style="display: flex; flex-direction: column; gap: 4px; flex-grow: 1;">
            <div style="font-size: 17px; font-weight: 600; color: rgba(251,237,233,0.50);">Raagfinder by Name</div>
            <div style="font-size: 13px; line-height: 1.45; color: rgba(251,237,233,0.40); text-wrap: pretty;">Look up a raag: thaat, aaroha, avaroha, chalan.</div>
          </div>
          <div style="flex-shrink: 0; font-size: 9px; letter-spacing: 0.20em; font-weight: 700; color: rgba(251,237,233,0.34); border: 1px solid rgba(251,237,233,0.14); border-radius: 3px; padding: 5px 7px;">SOON</div>
        </div>

      </div>
    </div>
  </div>

  <div style="flex-grow: 1;"></div>

  <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px;">
    <div style="display: flex; gap: 8px; align-items: center;">
      <div style="font-size: 13px; font-weight: 600; color: #FBEDE9; padding: 12px 14px; border: 1px solid rgba(221,47,79,0.34); background: rgba(221,47,79,0.08); border-radius: 4px; line-height: 20px;">English</div>
      <div style="font-family: 'Tiro Devanagari Marathi', Georgia, serif; font-size: 15px; color: rgba(251,237,233,0.50); padding: 12px 14px; border: 1px solid rgba(251,237,233,0.10); border-radius: 4px; line-height: 20px;">मराठी</div>
      <div style="font-family: 'Tiro Devanagari Marathi', Georgia, serif; font-size: 15px; color: rgba(251,237,233,0.50); padding: 12px 14px; border: 1px solid rgba(251,237,233,0.10); border-radius: 4px; line-height: 20px;">हिंदी</div>
    </div>
    <div style="font-size: 10px; letter-spacing: 0.20em; font-weight: 600; color: rgba(251,237,233,0.35);">0.1.0</div>
  </div>

</div>
</x-dc>
</body>
</html>
