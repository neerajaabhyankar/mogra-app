<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mukta:wght@300;400;500;600;700&amp;family=Tiro+Devanagari+Marathi:ital@0;1&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #0A0709; color: #FBEDE9; font-family: 'Mukta', ui-sans-serif, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #F7758F; } a:hover { color: #DD2F4F; }
    @keyframes mg-blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #0A0709; display: flex; flex-direction: column; padding: 54px 24px 34px; overflow: hidden;">

  <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; height: 44px; flex-shrink: 0;">
    <div style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: flex-start;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="color: rgba(251,237,233,0.70);"><path d="M15 5l-7 7 7 7"></path></svg></div>
    <div style="font-size: 10px; letter-spacing: 0.20em; text-transform: uppercase; font-weight: 700; color: rgba(251,237,233,0.42);">Raag Identifier</div>
    <div style="font-size: 11px; letter-spacing: 0.10em; font-weight: 600; color: rgba(251,237,233,0.28);">2 / 2</div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 24px; margin-top: 22px;">

    <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; height: 44px; padding: 0 14px; border: 1px solid rgba(251,237,233,0.10); border-radius: 4px; background: rgba(251,237,233,0.028);">
      <div style="display: flex; align-items: baseline; gap: 9px;">
        <div style="font-size: 10px; letter-spacing: 0.20em; text-transform: uppercase; font-weight: 700; color: rgba(251,237,233,0.32);">Sa</div>
        <div style="font-size: 15px; font-weight: 600; color: #FBEDE9;">C♯3</div>
        <div style="font-size: 12.5px; color: rgba(251,237,233,0.42);">138.59 Hz</div>
      </div>
      <div style="height: 44px; display: flex; align-items: center; padding: 0 4px; font-size: 12.5px; font-weight: 600; color: #F7758F;">Change</div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 9px;">
      <div style="font-family: 'Tiro Devanagari Marathi', Georgia, serif; font-size: 33px; line-height: 1.12; letter-spacing: -0.01em; color: #FBEDE9;">Sing, hum or play</div>
      <div style="font-size: 13.5px; line-height: 1.55; color: rgba(251,237,233,0.48); text-wrap: pretty;">One voice or instrument, close to the phone. A tanpura or tabla in the background is fine.</div>
    </div>

    <div style="display: flex; justify-content: center; padding-top: 4px;">
      <svg width="342" height="118" viewBox="0 0 342 118" fill="none">
        <path d="M3.3 46.9V71.1M9.9 44.1V73.9M16.4 32.0V86.0M23.0 40.4V77.6M29.6 27.9V90.1M36.2 29.7V88.3M42.8 36.0V82.0M49.3 22.5V95.5M55.9 34.5V83.5M62.5 22.2V95.8M69.1 32.4V85.6M75.6 31.6V86.4M82.2 21.4V96.6M88.8 9.6V108.4M95.4 31.2V86.8M101.9 29.0V89.0M108.5 18.7V99.3M115.1 12.0V106.0M121.7 23.9V94.1M128.2 30.6V87.4M134.8 20.6V97.4M141.4 42.5V75.5M148.0 31.8V86.2M154.6 45.3V72.7M161.1 45.0V73.0M167.7 42.4V75.6M174.3 36.2V81.8M180.9 22.3V95.7M187.4 34.7V83.3M194.0 22.7V95.3M200.6 19.3V98.7M207.2 25.2V92.8M213.8 19.1V98.9M220.3 32.7V85.3M226.9 32.5V85.5M233.5 28.0V90.0M240.1 13.9V104.1M246.6 22.0V96.0M253.2 26.1V91.9M259.8 19.5V98.5M266.4 24.7V93.3M272.9 30.4V87.6M279.5 20.5V97.5M286.1 25.7V92.3M292.7 38.1V79.9M299.2 35.4V82.6M305.8 40.8V77.2M312.4 36.0V82.0M319.0 32.7V85.3M325.6 37.2V80.8M332.1 19.6V98.4M338.7 36.6V81.4" stroke="#DD2F4F" stroke-width="2.6" stroke-linecap="round" opacity="0.92"></path>
      </svg>
    </div>

    <div style="display: flex; flex-direction: column; gap: 14px;">
      <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px;">
        <div style="font-family: 'Tiro Devanagari Marathi', Georgia, serif; font-size: 44px; line-height: 1; letter-spacing: 0.01em; color: #FBEDE9; font-variant-numeric: tabular-nums;">00:34</div>
        <div style="display: flex; align-items: center; gap: 8px;">
          <div style="width: 8px; height: 8px; border-radius: 50%; background: #DD2F4F; animation: mg-blink 1.4s ease-in-out infinite;"></div>
          <div style="font-size: 10px; letter-spacing: 0.20em; text-transform: uppercase; font-weight: 700; color: rgba(251,237,233,0.42);">Recording</div>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 9px;">
        <div style="position: relative; height: 3px; width: 100%; background: rgba(251,237,233,0.10); border-radius: 2px;">
          <div style="position: absolute; left: 0; top: 0; height: 3px; width: 85%; background: #DD2F4F; border-radius: 2px;"></div>
          <div style="position: absolute; left: 50%; top: -4px; width: 1px; height: 12px; background: rgba(251,237,233,0.55);"></div>
        </div>
        <div style="font-size: 13px; line-height: 1.5; color: rgba(251,237,233,0.52);">Past the 20-second minimum. Longer is better — an alap or a full bandish gives it much more to go on.</div>
      </div>
    </div>

  </div>

  <div style="flex-grow: 1;"></div>

  <div style="display: flex; flex-direction: column; align-items: center; gap: 14px;">
    <div style="width: 78px; height: 78px; border-radius: 50%; background: #DD2F4F; display: flex; align-items: center; justify-content: center;">
      <div style="width: 26px; height: 26px; border-radius: 3px; background: #FFF1F3;"></div>
    </div>
    <div style="font-size: 14px; font-weight: 600; color: #FBEDE9;">Stop &amp; identify</div>
  </div>

</div>
</x-dc>
</body>
</html>
