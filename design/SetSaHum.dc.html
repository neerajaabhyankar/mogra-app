<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mukta:wght@300;400;500;600;700&amp;family=Tiro+Devanagari+Marathi:ital@0;1&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #0A0709; color: #FBEDE9; font-family: 'Mukta', ui-sans-serif, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #F7758F; } a:hover { color: #DD2F4F; }
    @keyframes mg-pulse { 0% { transform: scale(0.86); opacity: 0.55; } 70% { transform: scale(1.18); opacity: 0; } 100% { transform: scale(1.18); opacity: 0; } }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #0A0709; display: flex; flex-direction: column; padding: 54px 24px 34px; overflow: hidden;">

  <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; height: 44px; flex-shrink: 0;">
    <div style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: flex-start;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="color: rgba(251,237,233,0.70);"><path d="M15 5l-7 7 7 7"></path></svg></div>
    <div style="font-size: 10px; letter-spacing: 0.20em; text-transform: uppercase; font-weight: 700; color: rgba(251,237,233,0.42);">Raag Identifier</div>
    <div style="font-size: 11px; letter-spacing: 0.10em; font-weight: 600; color: rgba(251,237,233,0.28);">1 / 2</div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 24px; margin-top: 22px;">

    <div style="display: flex; flex-direction: column; gap: 9px;">
      <div style="font-family: 'Tiro Devanagari Marathi', Georgia, serif; font-size: 33px; line-height: 1.12; letter-spacing: -0.01em; color: #FBEDE9;">Where is your Sa?</div>
      <div style="font-size: 13.5px; line-height: 1.55; color: rgba(251,237,233,0.48); text-wrap: pretty;">Hold one steady note.</div>
    </div>

    <div style="display: flex; gap: 3px; padding: 3px; background: rgba(251,237,233,0.045); border-radius: 4px; border: 1px solid rgba(251,237,233,0.10);">
      <div style="flex: 1; text-align: center; padding: 11px 0; font-size: 13.5px; font-weight: 600; color: #FBEDE9; background: rgba(221,47,79,0.20); border: 1px solid rgba(221,47,79,0.36); border-radius: 3px; line-height: 20px;">Hum it</div>
      <div style="flex: 1; text-align: center; padding: 11px 0; font-size: 13.5px; font-weight: 500; color: rgba(251,237,233,0.45); border: 1px solid transparent; border-radius: 3px; line-height: 20px;">Pick a note</div>
      <div style="flex: 1; text-align: center; padding: 11px 0; font-size: 13.5px; font-weight: 500; color: rgba(251,237,233,0.45); border: 1px solid transparent; border-radius: 3px; line-height: 20px;">Enter Hz</div>
    </div>

    <div style="display: flex; justify-content: center; padding-top: 6px;">
      <div style="position: relative; width: 208px; height: 208px;">
        <div style="position: absolute; inset: 0; border-radius: 50%; border: 1px solid rgba(221,47,79,0.45); animation: mg-pulse 2.6s ease-out infinite;"></div>
        <div style="position: absolute; inset: 0; border-radius: 50%; border: 1px solid rgba(221,47,79,0.45); animation: mg-pulse 2.6s ease-out infinite; animation-delay: 1.3s;"></div>
        <svg width="208" height="208" viewBox="0 0 208 208" style="position: absolute; inset: 0; transform: rotate(-90deg);">
          <circle cx="104" cy="104" r="98" fill="none" stroke="rgba(251,237,233,0.09)" stroke-width="2"></circle>
          <circle cx="104" cy="104" r="98" fill="none" stroke="#DD2F4F" stroke-width="2" stroke-linecap="round" stroke-dasharray="394 616"></circle>
        </svg>
        <div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;">
          <div style="display: flex; align-items: baseline; gap: 5px;">
            <div style="font-family: 'Tiro Devanagari Marathi', Georgia, serif; font-size: 50px; line-height: 1; color: #FBEDE9;">138.9</div>
            <div style="font-size: 14px; font-weight: 500; color: rgba(251,237,233,0.40);">Hz</div>
          </div>
          <div style="font-size: 10px; letter-spacing: 0.20em; text-transform: uppercase; font-weight: 700; color: rgba(221,47,79,0.90);">Listening</div>
        </div>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; align-items: center; gap: 12px;">
      <div style="display: flex; align-items: baseline; gap: 10px;">
        <div style="font-size: 20px; font-weight: 600; color: #FBEDE9;">C♯3</div>
        <div style="font-size: 13px; font-weight: 500; color: rgba(251,237,233,0.42);">+4 cents</div>
      </div>
      <div style="position: relative; width: 244px; height: 26px;">
        <div style="position: absolute; left: 0; top: 12px; width: 244px; height: 1px; background: rgba(251,237,233,0.14);"></div>
        <div style="position: absolute; left: 121px; top: 5px; width: 2px; height: 15px; background: rgba(251,237,233,0.28);"></div>
        <div style="position: absolute; left: 131px; top: 0; width: 2px; height: 26px; background: #DD2F4F; border-radius: 1px;"></div>
      </div>
      <div style="display: flex; justify-content: space-between; width: 244px;">
        <div style="font-size: 10px; letter-spacing: 0.10em; font-weight: 600; color: rgba(251,237,233,0.40);">−50</div>
        <div style="font-size: 10px; letter-spacing: 0.10em; font-weight: 600; color: rgba(251,237,233,0.40);">0</div>
        <div style="font-size: 10px; letter-spacing: 0.10em; font-weight: 600; color: rgba(251,237,233,0.40);">+50</div>
      </div>
    </div>

  </div>

  <div style="flex-grow: 1;"></div>

  <div style="display: flex; flex-direction: column; gap: 16px;">
    <div style="display: flex; flex-direction: column; gap: 8px;">
      <div style="display: flex; justify-content: space-between; align-items: baseline;">
        <div style="font-size: 12.5px; color: rgba(251,237,233,0.45);">Holding steady</div>
        <div style="font-size: 12.5px; font-weight: 600; color: rgba(251,237,233,0.62);">3.2 s of 5</div>
      </div>
      <div style="height: 3px; width: 100%; background: rgba(251,237,233,0.10); border-radius: 2px; overflow: hidden;">
        <div style="height: 3px; width: 64%; background: #DD2F4F; border-radius: 2px;"></div>
      </div>
    </div>
    <div style="height: 54px; border-radius: 4px; border: 1px solid rgba(251,237,233,0.16); display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600; color: rgba(251,237,233,0.78);">Cancel</div>
  </div>

</div>
</x-dc>
</body>
</html>
